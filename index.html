<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Eric Vaughn's Portfolio Page</title>
    </head>
    <body>
        <header>
            <h1>Eric Vaughn's Portfolio</h1>
            <!-- Tagline -->
            <p>This is my online portfolio!</p>
        </header>

        <main>
            <!-- About section -->
            <section>
                <h2>About Me</h2>
                <p>I'm Eric Vaughn, a programmer learning WebDev!</p>
            </section>

            <!-- Skills section -->
            <section>
                <h2>Skills</h2>
                <table style="text-align: center;">
                    <!-- Header row -->
                    <tr>
                        <th>Skill</th>
                        <th>Proficiency Level out of 10</th>
                    </tr>

                    <!-- Data row 1 -->
                    <tr>
                        <th>Programing</th>
                        <td>8</td>
                    </tr>

                    <!-- Data row 2 -->
                    <tr>
                        <th>File System</th>
                        <td>9</td>
                    </tr>

                    <!-- Data row 3 -->
                    <tr>
                        <th>Keyboard Shortcuts</th>
                        <td>7</td>
                    </tr>

                    <!-- Data row 4 -->
                    <tr>
                        <th>Writing</th>
                        <td>7.5</td>
                    </tr>
                </table>
            </section>

            <!-- Contact Form section -->
            <section>
                <h2>Contact Form</h2>
                <form>
                    <!-- Text input -->
                    <div>
                        <label for="Name">Name:</label>
                        <input type="text" id="name" name="name" required />
                    </div>

                    <!-- Email address -->
                    <div>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required />
                    </div>

                    <!-- Message address -->
                    <div>
                        <label for="message">Message:</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="4"
                            cols="50"
                        >
Put your message here!
                        </textarea>
                    </div>

                    <!-- Submit button -->
                    <div>
                        <input type="submit" value="Submit Button" />
                    </div>
                </form>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <h2>Footer</h2>
            <p>
                <a href="https://github.com/Eric-Vaughn"
                    >Eric Vaughn's Github</a
                >
            </p>
        </footer>
    </body>
</html>
